spring.application.name=collection-service
server.port=8082

# MySQL ? create the database first: CREATE DATABASE reloop_collection_db;
spring.datasource.url=jdbc:mysql://localhost:3306/reloop_collection
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Marketplace Service URL (used by Feign client)
marketplace.service.url=http://192.168.137.243:8081
# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs