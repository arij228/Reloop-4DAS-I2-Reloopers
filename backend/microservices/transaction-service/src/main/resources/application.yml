server:
  port: 8083

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:mysql://localhost:3306/reloop_transaction_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root # Change this if your MySQL password is different!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Tells Hibernate NOT to create tables, Flyway will do it
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true # <--- THIS FIXES YOUR ERROR
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html